name: Android build

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      # The APKs bundle the web portal from the repository root.
      - "*.html"
      - "*.js"
      - "*.css"
      - "manifest.json"
      - "pwa-icon.*"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      # The APKs bundle the web portal from the repository root.
      - "*.html"
      - "*.js"
      - "*.css"
      - "manifest.json"
      - "pwa-icon.*"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build all portal variants
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Assemble student, parent, and teacher apps
        run: gradle --no-daemon :app:assembleStudentDebug :app:assembleParentDebug :app:assembleTeacherDebug
