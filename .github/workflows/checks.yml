name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web portal scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check shared scripts
        run: for file in *.js; do node --check "$file"; done
      - name: No page loads a script the portal does not ship
        run: "! grep -n 'supabase' *.html *.js"

  backend:
    name: Database and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax-check the server
        working-directory: server
        run: for file in src/*.js scripts/*.js; do node --check "$file"; done
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Platform layer, migration and RFID database tests
        working-directory: tests
        run: npm run test:db
      - name: Portal API tests (sign-in, row-level security, RPC, server functions)
        working-directory: tests
        run: npm run test:api
      - name: Teacher portal RFID panel and register tests
        working-directory: tests
        run: npm run test:ui
      - name: RFID endpoint end-to-end test
        working-directory: tests
        run: npm run test:e2e

  firmware:
    name: RFID reader firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a placeholder config.h
        working-directory: hardware/nexora_rfid_reader
        run: sed 's/PASTE_THE_DEVICE_SECRET_HERE/ci-placeholder-secret-not-used-anywhere-00/' config.example.h > config.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 2.0.17
          libraries: |
            - name: MFRC522
              version: 1.4.11
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
            - name: ArduinoJson
              version: 7.2.1
          sketch-paths: |
            - hardware/nexora_rfid_reader
          enable-deltas-report: false
